<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reprint AWB (Fix Wrap Alamat)</title>
  
  <!-- MEMAKSA DOWNLOAD FONT ROBOTO DARI GOOGLE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* Mengunci font dasar menggunakan Roboto dari Google Fonts */
    body { background-color: #0f0f1a; color: #ffffff; font-family: 'Roboto', sans-serif !important; }
    .card-dark { background-color: #1a1a2e; border: 1px solid #2a2a4a; }
    .input-dark { background-color: #121224; border: 1px solid #d946ef; color: #ffffff; }
    .btn-pink { background: linear-gradient(135deg, #d946ef 0%, #ec4899 100%); }
    
    #renderOffscreen {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 576px !important;
      background-color: #ffffff;
      color: #000000;
      box-sizing: border-box;
      padding: 16px 14px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 0px; 
    }

    /* Memaksa SEMUA teks di dalam area cetak menjadi Roboto */
    #renderOffscreen, #renderOffscreen * {
      font-family: 'Roboto', sans-serif !important;
    }
  </style>
</head>
<body class="min-h-screen p-4 max-w-md mx-auto relative pb-20">

  <!-- RENDER AREA KHUSUS PRINTER -->
  <div id="renderOffscreen">
    <!-- Header Atas -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid #000; padding-bottom: 12px; margin-bottom: 10px;">
      <span style="font-size: 32px; font-weight: bold; color: #000; letter-spacing: 1px; line-height: 1;">Anteraja</span>
      <span style="font-size: 18px; font-weight: bold; color: #000; line-height: 1;">☎ 021-5066 3333</span>
    </div>

    <!-- Barcode & Nomor Resi -->
    <div style="text-align: center; display: flex; flex-direction: column; align-items: center; margin-bottom: 15px;">
      <svg id="barcodeCanvasOffscreen" style="max-width: 100%;"></svg>
      <div id="offResi" style="font-size: 18px; font-weight: bold; margin-top: 4px;"></div>
    </div>

    <!-- Kode UZ -->
    <div id="uzContainerOff" style="text-align: center; border-bottom: 4px solid #000; padding-bottom: 25px; margin-bottom: 15px;">
      <div id="offKodeUz" style="display: inline-block; font-size: 58px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; line-height: 1; color: #000;"></div>
    </div>

    <!-- Alamat Tujuan -->
    <div id="offAlamat" style="font-size: 20px; font-weight: bold; text-transform: uppercase; text-align: center; word-break: break-word; line-height: 1.2; color: #000;"></div>
  </div>

  <!-- TAMPILAN UTAMA HP -->
  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-10 rounded-full bg-pink-600 flex items-center justify-center text-white font-bold text-lg">A</div>
    <div>
      <h1 class="text-xl font-bold tracking-wide">Reprint AWB</h1>
      <p class="text-xs text-emerald-400 font-bold">Fast Auto-Height Engine</p>
    </div>
  </div>

  <!-- FORM INPUT DATA -->
  <div class="card-dark rounded-2xl p-5 mb-6 shadow-xl">
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Nomor Resi (AWB)</label>
        <div class="flex gap-2">
          <input type="text" id="noResi" placeholder="Scan / ketik resi..." class="w-full input-dark rounded-xl px-4 py-3 text-sm font-mono">
          <button onclick="startScanMain()" class="bg-purple-600 text-white px-4 rounded-xl text-xs font-bold hover:bg-purple-700">SCAN</button>
        </div>
      </div>
      <div id="readerMain" class="hidden rounded-xl overflow-hidden shadow-lg border border-pink-500 bg-white"></div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Kode UZ (Opsional)</label>
        <input type="text" id="kodeUz" placeholder="Kosongkan jika tidak perlu..." class="w-full input-dark rounded-xl px-4 py-3 text-sm font-bold uppercase">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Alamat Tujuan (Opsional)</label>
        <textarea id="alamat" rows="3" placeholder="Kosongkan jika hanya cetak resi..." class="w-full input-dark rounded-xl px-4 py-3 text-sm"></textarea>
      </div>
      <button onclick="generatePreview()" class="w-full btn-pink text-white font-bold py-3.5 rounded-xl text-sm">Buat Preview Label</button>
    </div>
  </div>

  <!-- PREVIEW LAYAR & PANEL CETAK -->
  <div class="card-dark rounded-2xl p-5 mb-6">
    <h2 class="text-xs font-semibold text-gray-400 uppercase mb-3">Preview & Panel Cetak</h2>
    
    <div id="previewWrapper" class="flex flex-col gap-4 hidden">
      <!-- TAMPILAN LABEL UI -->
      <div class="bg-white text-black p-3 rounded-lg w-full flex flex-col border border-gray-300">
        <div class="flex justify-between items-center border-b-2 border-black pb-2 mb-2">
          <span class="font-bold text-2xl text-black tracking-wide">Anteraja</span>
          <span class="text-sm font-bold text-black">021-5066 3333</span>
        </div>
        
        <div class="text-center my-1">
          <svg id="barcodeCanvasUI" class="max-w-full mx-auto"></svg>
          <div id="dispResiUI" class="text-xs font-bold mt-1 text-black"></div>
        </div>
        
        <div class="text-center border-b-2 border-black pb-3 mb-2 mt-2" id="uzContainerUI">
          <div id="dispKodeUzUI" class="text-4xl font-bold uppercase text-black"></div>
        </div>
        
        <!-- Kelas 'truncate' dihapus dan diganti dengan 'break-words' -->
        <div id="dispAlamatUI" class="text-sm font-bold uppercase text-center break-words text-black"></div>
      </div>

      <!-- KONTROL BLUETOOTH PRINTER -->
      <div class="bg-gray-900/90 rounded-xl p-4 border border-gray-700 space-y-3">
        <div class="flex items-center justify-between gap-2">
          <span id="btStatus" class="text-xs font-bold text-gray-400 truncate">Status: Belum Terhubung</span>
          <button onclick="connectBluetooth()" class="bg-purple-600 text-white font-bold py-2 px-3 rounded-xl text-xs hover:bg-purple-700 shrink-0">Sambungkan Printer</button>
        </div>

        <div id="progressBox" class="hidden">
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
          </div>
          <p id="progressText" class="text-[10px] font-bold text-gray-400 mt-1 text-center">Mencetak... 0%</p>
        </div>

        <button id="btnCetakModal" onclick="kirimKePrinter()" class="w-full btn-pink text-white font-black py-3.5 rounded-xl text-sm shadow-md">⚡ CETAK LABEL CEPAT</button>
      </div>
    </div>

    <div id="labelPlaceholder" class="text-center py-8 text-gray-500 text-xs italic">Isi data di atas lalu klik "Buat Preview Label"</div>
  </div>

  <script>
    let printDevice = null;
    let printCharacteristic = null;
    let html5QrcodeScanner = null;

    function startScanMain() { 
      const readerEl = document.getElementById('readerMain');
      readerEl.classList.remove('hidden');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          initializeScanner();
        }).catch(() => { initializeScanner(); });
      } else { initializeScanner(); }
    }

    function initializeScanner() {
      html5QrcodeScanner = new Html5Qrcode("readerMain");
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 100 } }, 
        (decodedText) => { 
          document.getElementById('noResi').value = decodedText; 
          stopScan(); 
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("Gagal membuka kamera. Pastikan izin kamera aktif.");
        document.getElementById('readerMain').classList.add('hidden');
      });
    }

    function stopScan() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('readerMain').classList.add('hidden');
          html5QrcodeScanner = null;
        }).catch(e => { document.getElementById('readerMain').classList.add('hidden'); });
      }
    }

    function generatePreview() {
      const resi = document.getElementById('noResi').value.trim();
      const uz = document.getElementById('kodeUz').value.trim();
      const alamat = document.getElementById('alamat').value.trim();
      
      if (!resi) return alert('Mohon isi Nomor Resi terlebih dahulu!');

      document.getElementById('dispResiUI').innerText = 'Nomor Resi ' + resi;
      document.getElementById('offResi').innerText = 'Nomor Resi ' + resi;
      try { JsBarcode("#barcodeCanvasUI", resi, { format: "CODE128", width: 1.8, height: 45, displayValue: false, margin: 0 }); } catch(e) {}
      try { JsBarcode("#barcodeCanvasOffscreen", resi, { format: "CODE128", width: 3.0, height: 70, displayValue: false, margin: 0 }); } catch(e) {}

      if (uz === "") {
        document.getElementById('uzContainerUI').style.display = 'none';
        document.getElementById('uzContainerOff').style.display = 'none';
      } else {
        document.getElementById('uzContainerUI').style.display = 'block';
        document.getElementById('uzContainerOff').style.display = 'block';
        document.getElementById('dispKodeUzUI').innerText = uz;
        document.getElementById('offKodeUz').innerText = uz;
      }

      if (alamat === "") {
        document.getElementById('dispAlamatUI').style.display = 'none';
        document.getElementById('offAlamat').style.display = 'none';
      } else {
        document.getElementById('dispAlamatUI').style.display = 'block';
        document.getElementById('offAlamat').style.display = 'block';
        document.getElementById('dispAlamatUI').innerText = alamat;
        document.getElementById('offAlamat').innerText = alamat;
      }

      document.getElementById('labelPlaceholder').classList.add('hidden');
      document.getElementById('previewWrapper').classList.remove('hidden');
    }

    async function connectBluetooth() {
      const btStatus = document.getElementById('btStatus');
      btStatus.innerText = 'Mencari printer...';
      try {
        printDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000e025-0000-1000-8000-00805f9b34fb']
        });
        btStatus.innerText = 'Menghubungkan...';
        const server = await printDevice.gatt.connect();
        const services = await server.getPrimaryServices();
        for (let service of services) {
          const characteristics = await service.getCharacteristics();
          for (let c of characteristics) {
            if (c.properties.write || c.properties.writeWithoutResponse) { printCharacteristic = c; break; }
          }
          if (printCharacteristic) break;
        }
        if (printCharacteristic) {
          btStatus.innerText = 'Terhubung: ' + (printDevice.name || 'Printer');
          btStatus.className = 'text-xs font-bold text-green-400 truncate';
        } else throw new Error('Karakteristik tidak ditemukan.');
      } catch (err) {
        btStatus.innerText = 'Gagal: ' + err.message;
        btStatus.className = 'text-xs font-bold text-red-400 truncate';
      }
    }

    async function kirimKePrinter() {
      const btStatus = document.getElementById('btStatus');
      const progressBox = document.getElementById('progressBox');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      if (!printCharacteristic) return alert('Printer belum terhubung! Silakan klik Sambungkan Printer.');
      progressBox.classList.remove('hidden');
      btStatus.innerText = 'Merender Label...';

      try {
        await document.fonts.ready;

        const element = document.getElementById('renderOffscreen');
        const canvas = await html2canvas(element, { scale: 1.0, width: 576, backgroundColor: '#ffffff' });
        
        const escpos = await rasterizeToGSv0_Optimized(canvas);

        btStatus.innerText = 'Mencetak...';
        
        const chunkSize = 64; 
        for (let i = 0; i < escpos.length; i += chunkSize) {
          const chunk = escpos.slice(i, i + chunkSize);
          if (printCharacteristic.properties.write) {
            await printCharacteristic.writeValue(chunk);
          } else {
            await printCharacteristic.writeValueWithoutResponse(chunk);
          }
          let percent = Math.min(100, Math.round(((i + chunkSize) / escpos.length) * 100));
          progressBar.style.width = percent + '%';
          progressText.innerText = 'Mencetak... ' + percent + '%';
          await new Promise(r => setTimeout(r, 25));
        }
        
        btStatus.innerText = 'Berhasil dicetak ✓';
        btStatus.className = 'text-xs font-bold text-green-400 truncate';
        setTimeout(() => { progressBox.classList.add('hidden'); }, 2000);
      } catch (err) {
        alert('Gagal Mencetak: ' + err.message);
        btStatus.innerText = 'Gagal mencetak';
      }
    }

    async function rasterizeToGSv0_Optimized(canvas) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      const xBytes = 72;
      const xL = 72;
      const xH = 0;
      const yL = height & 0xFF;
      const yH = (height >> 8) & 0xFF;

      let bytes = [0x1B, 0x40]; 
      bytes.push(0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < xBytes; x++) {
          let b = 0;
          for (let k = 0; k < 8; k++) {
            const px = (x * 8) + k;
            const idx = (y * width + px) * 4;
            const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
            if (data[idx+3] > 128 && brightness < 128) {
              b |= (1 << (7 - k));
            }
          }
          bytes.push(b);
        }
      }
      bytes.push(0x0A, 0x0A, 0x0A); 
      return new Uint8Array(bytes);
    }
  </script>
</body>
            </html>
